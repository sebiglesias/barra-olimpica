<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="redPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bluePlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="yellowPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Olympic Barbell Graphic -->
  <!-- Center Barbell Shaft -->
  <rect x="50" y="246" width="412" height="20" rx="4" fill="url(#steelGrad)"/>
  
  <!-- Left Sleeve Collar -->
  <rect x="120" y="236" width="16" height="40" rx="3" fill="#71717a"/>
  <!-- Right Sleeve Collar -->
  <rect x="376" y="236" width="16" height="40" rx="3" fill="#71717a"/>

  <!-- Left Plates Stack -->
  <!-- 25kg Red Plate -->
  <rect x="138" y="146" width="22" height="220" rx="6" fill="url(#redPlate)"/>
  <!-- 20kg Blue Plate -->
  <rect x="162" y="156" width="20" height="200" rx="6" fill="url(#bluePlate)"/>
  <!-- 15kg Yellow Plate -->
  <rect x="184" y="171" width="18" height="170" rx="6" fill="url(#yellowPlate)"/>

  <!-- Right Plates Stack -->
  <!-- 15kg Yellow Plate -->
  <rect x="310" y="171" width="18" height="170" rx="6" fill="url(#yellowPlate)"/>
  <!-- 20kg Blue Plate -->
  <rect x="330" y="156" width="20" height="200" rx="6" fill="url(#bluePlate)"/>
  <!-- 25kg Red Plate -->
  <rect x="352" y="146" width="22" height="220" rx="6" fill="url(#redPlate)"/>

  <!-- Safety Spring Collars -->
  <rect x="204" y="240" width="8" height="32" rx="2" fill="#d4d4d8"/>
  <rect x="300" y="240" width="8" height="32" rx="2" fill="#d4d4d8"/>

  <!-- Center knurling textured lines -->
  <line x1="230" y1="246" x2="230" y2="266" stroke="#71717a" stroke-width="2"/>
  <line x1="240" y1="246" x2="240" y2="266" stroke="#71717a" stroke-width="2"/>
  <line x1="256" y1="246" x2="256" y2="266" stroke="#3f3f46" stroke-width="2"/>
  <line x1="272" y1="246" x2="272" y2="266" stroke="#71717a" stroke-width="2"/>
  <line x1="282" y1="246" x2="282" y2="266" stroke="#71717a" stroke-width="2"/>

  <!-- 1RM Gold Badge -->
  <g transform="translate(256, 395)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#eab308"/>
    <text x="0" y="6" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">1RM • IWF</text>
  </g>
</svg>
